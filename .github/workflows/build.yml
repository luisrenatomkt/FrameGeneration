name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Gradle 2.14.1 (exigido pelo ForgeGradle 2.1)
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle.zip -d $HOME
          echo "$HOME/gradle-2.14.1/bin" >> $GITHUB_PATH
      - name: Build
        run: gradle setupCiWorkspace build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FrameGen-1.8.9-jar
          path: build/libs/*.jar
